name: ClipForge CI

on:
  push:
    branches: [main, "chatgpt/**", "work/**", "codex/clipforge-core-rescue"]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "services/clip/**"
      - "services/news/**"
      - "types/clip.ts"
      - "types/news.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify code
        run: npm run verify

      - name: Build
        run: npx next build

      - name: Resumable upload service and real MP4
        run: node scripts/core-rescue-e2e.mjs

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-core-rescue-media
          path: artifacts/core-rescue/first-validated.mp4

      - name: Phase 1 end-to-end
        run: npm run phase1:e2e

      - name: Six-scene narrated story acceptance
        run: node scripts/story-scenes-e2e.mjs

      - name: Complete video silence editing acceptance
        run: node scripts/video-autoedit-e2e.mjs

      - name: Story and edited video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-story-and-edit-media
          path: |
            artifacts/story-scenes/maya-60s.mp4
            artifacts/story-scenes/evidence.json
            artifacts/story-scenes/scene-*.jpg
            artifacts/video-autoedit/*.mp4
            artifacts/video-autoedit/evidence.json

      - name: Clip render end-to-end
        run: npm run render:e2e

      - name: AutoEdit full end-to-end
        run: npm run autoedit:e2e

      - name: Owned Content end-to-end
        run: npm run owned-content:e2e

      - name: Auto Focus end-to-end
        run: npm run reframe:e2e

      - name: News Mode end-to-end
        run: npm run news:e2e

  real-whisper-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install free local media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Build existing pinned Whisper implementation
        run: bash scripts/setup-whisper-ci.sh
      - name: Twenty-minute recording and three real clips
        run: node scripts/best-clips-e2e.mjs
      - name: Preserve clips and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-three-clips-media
          path: |
            artifacts/best-clips/clip-*.mp4
            artifacts/best-clips/clip-*.jpg
            artifacts/best-clips/podcast-20m.mp4
            artifacts/best-clips/evidence.json
            artifacts/best-clips/authored-narration.txt
