name: ClipForge CI

# Always run on pull requests; path filters can leave critical changes untested.
on:
  push:
    branches: [main, "chatgpt/**", "work/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify code
        run: npm run verify

      - name: Build
        run: npx next build

      - name: Phase 1 end-to-end
        run: npm run phase1:e2e

      - name: Clip render end-to-end
        run: npm run render:e2e

      - name: AutoEdit full end-to-end
        run: npm run autoedit:e2e

      - name: Owned Content end-to-end
        run: npm run owned-content:e2e

      - name: Auto Focus end-to-end
        run: npm run reframe:e2e

      - name: News Mode end-to-end
        run: npm run news:e2e

  quality-gate:
    name: Required Quality Gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, or skipped verification
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "Verification result: $VERIFY_RESULT"
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error::ClipForge verification did not succeed; refusing approval."
            exit 1
          fi
