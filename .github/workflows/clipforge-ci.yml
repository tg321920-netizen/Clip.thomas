name: ClipForge CI

on:
  push:
    branches: [main, "chatgpt/**"]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - ".github/workflows/clipforge-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/clipforge-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify code
        run: npm run verify

      - name: Build
        run: npx next build

      - name: Generate a real sample video
        run: |
          ffmpeg -y \
            -f lavfi -i testsrc2=size=640x360:rate=30 \
            -f lavfi -i sine=frequency=1000:sample_rate=44100 \
            -t 2 \
            -c:v libx264 -pix_fmt yuv420p \
            -c:a aac \
            /tmp/clipforge-phase1.mp4

      - name: Start production server
        run: |
          npm run start > /tmp/clipforge-server.log 2>&1 &
          echo $! > /tmp/clipforge-server.pid

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/clipforge-server.log
          exit 1

      - name: Verify real media tools
        run: |
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3000/api/system/media-status \
            -o /tmp/media-status.json
          node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/media-status.json", "utf8"));
          if (
            !payload.ready ||
            !payload.tools?.ffmpeg?.available ||
            !payload.tools?.ffprobe?.available ||
            !payload.storage?.writable
          ) {
            throw new Error("Media environment readiness check failed");
          }
          console.log("Media environment ready");
          NODE

      - name: Functional Phase 1 upload test
        run: |
          SIZE="$(stat -c%s /tmp/clipforge-phase1.mp4)"
          curl --fail-with-body --silent --show-error \
            -X POST http://127.0.0.1:3000/api/videos/upload \
            -H "Content-Type: video/mp4" \
            -H "X-File-Name: clipforge-phase1.mp4" \
            -H "X-File-Size: $SIZE" \
            --data-binary @/tmp/clipforge-phase1.mp4 \
            -o /tmp/clipforge-response.json

          node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/clipforge-response.json", "utf8"));
          const video = payload.video;
          if (!video) throw new Error("Missing video payload");
          if (video.width !== 640 || video.height !== 360) {
            throw new Error(`Unexpected resolution: ${video.width}x${video.height}`);
          }
          if (video.durationSeconds < 1.8 || video.durationSeconds > 2.2) {
            throw new Error(`Unexpected duration: ${video.durationSeconds}`);
          }
          if (
            !video.codec ||
            !video.projectId ||
            !video.aspectRatio ||
            !video.posterUrl ||
            !video.sourceUrl
          ) {
            throw new Error("Missing real media metadata");
          }
          fs.writeFileSync("/tmp/project-id.txt", video.projectId);
          fs.writeFileSync("/tmp/poster-url.txt", video.posterUrl);
          fs.writeFileSync("/tmp/source-url.txt", video.sourceUrl);
          console.log("Phase 1 upload passed", {
            duration: video.durationSeconds,
            resolution: `${video.width}x${video.height}`,
            fps: video.fps,
            codec: video.codec,
            aspectRatio: video.aspectRatio,
          });
          NODE

      - name: Verify generated FFmpeg poster
        run: |
          POSTER_URL="$(cat /tmp/poster-url.txt)"
          curl --fail-with-body --silent --show-error \
            "http://127.0.0.1:3000$POSTER_URL" \
            -o /tmp/clipforge-poster.jpg
          test "$(stat -c%s /tmp/clipforge-poster.jpg)" -gt 100
          node - <<'NODE'
          const fs = require("node:fs");
          const data = fs.readFileSync("/tmp/clipforge-poster.jpg");
          if (data[0] !== 0xff || data[1] !== 0xd8) {
            throw new Error("Generated poster is not a JPEG");
          }
          console.log("Real FFmpeg poster verified", { bytes: data.length });
          NODE

      - name: Verify source video range streaming
        run: |
          SOURCE_URL="$(cat /tmp/source-url.txt)"
          curl --fail-with-body --silent --show-error \
            -H "Range: bytes=0-1023" \
            -D /tmp/source-headers.txt \
            "http://127.0.0.1:3000$SOURCE_URL" \
            -o /tmp/source-range.bin
          grep -qi "^HTTP/.* 206" /tmp/source-headers.txt
          grep -qi "^Accept-Ranges: bytes" /tmp/source-headers.txt
          test "$(stat -c%s /tmp/source-range.bin)" -gt 0
          test "$(stat -c%s /tmp/source-range.bin)" -le 1024

      - name: Verify persisted project listing
        run: |
          PROJECT_ID="$(cat /tmp/project-id.txt)"
          curl --fail-with-body --silent --show-error \
            http://127.0.0.1:3000/api/projects \
            -o /tmp/projects.json

          PROJECT_ID="$PROJECT_ID" node - <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync("/tmp/projects.json", "utf8"));
          const id = process.env.PROJECT_ID;
          if (!Array.isArray(payload.projects)) {
            throw new Error("Projects payload is not an array");
          }
          const found = payload.projects.find((project) => project.id === id);
          if (!found) {
            throw new Error("Uploaded project was not persisted");
          }
          if (!found.source?.sourceUrl || !found.source?.posterUrl) {
            throw new Error("Persisted project is missing media URLs");
          }
          if ("relativePath" in found.source) {
            throw new Error("Internal storage path leaked through API");
          }
          console.log("Project persistence verified", { id });
          NODE

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/clipforge-server.log || true
