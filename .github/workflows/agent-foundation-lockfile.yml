name: Agent Foundation Lockfile

on:
  push:
    branches: ["codex/clipforge-agent-foundation"]
    paths:
      - "package.json"
      - ".github/workflows/agent-foundation-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/clipforge-agent-foundation
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update Next.js patch and lockfile
        run: npm install --save-exact --package-lock-only --ignore-scripts next@16.3.8 eslint-config-next@16.3.8
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update Next.js to 16.3.8"
          git push origin HEAD:codex/clipforge-agent-foundation
