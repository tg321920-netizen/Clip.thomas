# Free MVP runtime. This intentionally uses ephemeral storage so ClipForge can be
# tried without paid infrastructure. Data can disappear when the free instance
# sleeps, restarts or redeploys. Use render.production.yaml when durable storage
# and always-on processing become necessary.
services:
  - type: web
    name: clipforge-runtime-free
    runtime: docker
    plan: free
    region: virginia
    repo: https://github.com/tg321920-netizen/Clip.thomas
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile.free
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: CLIPFORGE_STORAGE_DIR
        value: /tmp/clipforge
      - key: CLIPFORGE_RUNTIME_HOME
        value: /tmp/clipforge/.runtime-home
      - key: CLIPFORGE_FREE_WORKER_POLL_MS
        value: "2500"
      - key: CLIPFORGE_REQUIRE_OWNER_AUTH
        value: "true"
      - key: CLIPFORGE_OWNER_ACCESS_KEY
        sync: false
      - key: CLIPFORGE_SESSION_KEY
        generateValue: true
      - key: CLIPFORGE_CREDENTIALS_KEY
        generateValue: true
      - key: CLIPFORGE_OAUTH_STATE_KEY
        generateValue: true
      - key: WHISPER_PROVIDER
        value: cpp
      - key: WHISPER_CPP_COMMAND
        value: /usr/local/bin/whisper-cli
      - key: WHISPER_CPP_MODEL_PATH
        value: /opt/clipforge/models/ggml-tiny.bin
      - key: WHISPER_CPP_THREADS
        value: "1"
      - key: ESPEAK_NG_PATH
        value: /usr/bin/espeak-ng
      - key: CLIPFORGE_NEWS_VOICE
        value: es
      - key: CLIPFORGE_NEWS_TTS_SPEED
        value: "165"
