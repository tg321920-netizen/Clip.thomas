name: ClipForge CI

on:
  push:
    branches: [main, "chatgpt/**", "work/**"]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "services/clip/**"
      - "services/news/**"
      - "types/clip.ts"
      - "types/news.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vercel.json"
      - ".github/workflows/clipforge-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/clipforge-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify code
        run: npm run verify

      - name: Build
        run: npx next build

      - name: Phase 1 end-to-end
        run: npm run phase1:e2e

      - name: Clip render end-to-end
        run: npm run render:e2e

      - name: Auto Focus end-to-end
        run: npm run reframe:e2e

      - name: News Mode end-to-end
        run: npm run news:e2e
