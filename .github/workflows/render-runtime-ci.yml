name: ClipForge Render Runtime

on:
  push:
    branches:
      - main
      - "chatgpt/**"
    paths:
      - "Dockerfile"
      - "Dockerfile.free"
      - ".dockerignore"
      - "render.yaml"
      - "render.production.yaml"
      - "scripts/render-native-free-build.sh"
      - "scripts/render-runtime.mjs"
      - "scripts/render-runtime-free.mjs"
      - "scripts/whisper-cpp-smoke.mjs"
      - "services/transcription/TranscriptionService.mjs"
      - "services/transcription/WhisperCppProvider.mjs"
      - "tests/whisper-cpp.test.mjs"
      - "app/api/health/route.ts"
      - "proxy.ts"
      - ".github/workflows/render-runtime-ci.yml"
  workflow_dispatch:

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag clipforge-runtime-ci .

      - name: Verify media binaries
        run: |
          docker run --rm \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            -e WHISPER_MODEL=tiny \
            clipforge-runtime-ci \
            node scripts/render-runtime.mjs --check

      - name: Boot full runtime and verify health
        run: |
          docker run --detach --name clipforge-runtime \
            -p 10000:10000 \
            -e PORT=10000 \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            -e WHISPER_MODEL=tiny \
            clipforge-runtime-ci

          cleanup() {
            docker logs clipforge-runtime || true
            docker rm --force clipforge-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if (value.status !== "ok" || value.mediaReady !== true || value.ffmpeg !== true || value.ffprobe !== true || value.storageWritable !== true) process.exit(1);'
              exit 0
            fi
            sleep 2
          done

          echo "ClipForge production runtime did not become healthy in time." >&2
          exit 1

  free-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build free image
        run: docker build --file Dockerfile.free --tag clipforge-runtime-free-ci .

      - name: Verify low-memory media binaries
        run: |
          docker run --rm \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            clipforge-runtime-free-ci \
            node scripts/render-runtime-free.mjs --check

      - name: Whisper.cpp real speech smoke test
        run: |
          docker run --rm \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            clipforge-runtime-free-ci \
            node scripts/whisper-cpp-smoke.mjs

      - name: Boot free runtime and verify health
        run: |
          docker run --detach --name clipforge-runtime-free \
            -p 10001:10000 \
            -e PORT=10000 \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            clipforge-runtime-free-ci

          cleanup() {
            docker logs clipforge-runtime-free || true
            docker rm --force clipforge-runtime-free >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:10001/api/health > /tmp/free-health.json; then
              cat /tmp/free-health.json
              node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/free-health.json","utf8")); if (value.status !== "ok" || value.mediaReady !== true || value.ffmpeg !== true || value.ffprobe !== true || value.storageWritable !== true) process.exit(1);'
              exit 0
            fi
            sleep 2
          done

          echo "ClipForge free runtime did not become healthy in time." >&2
          exit 1

  native-free-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify native host prerequisites
        run: |
          command -v node
          command -v npm
          command -v python3
          command -v curl
          command -v git

      - name: Build native Render runtime
        run: bash scripts/render-native-free-build.sh

      - name: Verify native media runtime
        run: |
          export PATH="$GITHUB_WORKSPACE/.runtime/bin:$PATH"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version >/dev/null
          ffprobe -version >/dev/null
          test -x "$GITHUB_WORKSPACE/.runtime/bin/whisper-cli"
          test -s "$GITHUB_WORKSPACE/.runtime/models/ggml-tiny.bin"
          "$GITHUB_WORKSPACE/.runtime/bin/whisper-cli" --help >/dev/null 2>&1 || true

      - name: Boot native runtime and verify health
        env:
          PORT: "10002"
          CLIPFORGE_STORAGE_DIR: /tmp/clipforge-native
          CLIPFORGE_RUNTIME_HOME: /tmp/clipforge-native/.runtime-home
          CLIPFORGE_REQUIRE_OWNER_AUTH: "false"
          FFMPEG_PATH: ${{ github.workspace }}/.runtime/bin/ffmpeg
          FFPROBE_PATH: ${{ github.workspace }}/.runtime/bin/ffprobe
          WHISPER_PROVIDER: cpp
          WHISPER_CPP_COMMAND: ${{ github.workspace }}/.runtime/bin/whisper-cli
          WHISPER_CPP_MODEL_PATH: ${{ github.workspace }}/.runtime/models/ggml-tiny.bin
          WHISPER_CPP_THREADS: "1"
        run: |
          node scripts/render-runtime-free.mjs > /tmp/native-runtime.log 2>&1 &
          runtime_pid=$!

          cleanup() {
            cat /tmp/native-runtime.log || true
            kill "$runtime_pid" >/dev/null 2>&1 || true
            wait "$runtime_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:10002/api/health > /tmp/native-health.json; then
              cat /tmp/native-health.json
              node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/native-health.json","utf8")); if (value.status !== "ok" || value.mediaReady !== true || value.ffmpeg !== true || value.ffprobe !== true || value.storageWritable !== true) process.exit(1);'
              exit 0
            fi
            sleep 2
          done

          echo "ClipForge native free runtime did not become healthy in time." >&2
          exit 1
