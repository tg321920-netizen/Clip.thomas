name: ClipForge CI

concurrency:
  group: clipforge-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/clipforge-core-rescue' }}

on:
  push:
    branches: [main, "chatgpt/**", "work/**", "codex/clipforge-core-rescue"]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "services/clip/**"
      - "services/news/**"
      - "types/clip.ts"
      - "types/news.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"

  # This workflow only verifies code. Audiovisual acceptance needs an approved
  # real source and the bounded plan in docs/CLIPFORGE_ACCEPTANCE.md.
  workflow_dispatch:

jobs:
  verify:
    env:
      CLIPFORGE_RUN_MEDIA_TESTS: "false"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify code without audiovisual generation
        run: npm run verify
      - name: Build application
        run: npx next build
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-code-failure
          path: |
            /home/runner/.npm/_logs/*.log
            .next/diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

