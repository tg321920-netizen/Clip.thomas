name: ClipForge Render Runtime

on:
  push:
    branches:
      - main
      - "chatgpt/**"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "render.yaml"
      - "scripts/render-runtime.mjs"
      - "app/api/health/route.ts"
      - "proxy.ts"
      - ".github/workflows/render-runtime-ci.yml"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag clipforge-runtime-ci .

      - name: Verify media binaries
        run: |
          docker run --rm \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            -e WHISPER_MODEL=tiny \
            clipforge-runtime-ci \
            node scripts/render-runtime.mjs --check

      - name: Boot full runtime and verify health
        run: |
          docker run --detach --name clipforge-runtime \
            -p 10000:10000 \
            -e PORT=10000 \
            -e CLIPFORGE_STORAGE_DIR=/tmp/clipforge \
            -e WHISPER_MODEL=tiny \
            clipforge-runtime-ci

          cleanup() {
            docker logs clipforge-runtime || true
            docker rm --force clipforge-runtime >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if (value.status !== "ok" || value.mediaReady !== true || value.ffmpeg !== true || value.ffprobe !== true || value.storageWritable !== true) process.exit(1);'
              exit 0
            fi
            sleep 2
          done

          echo "ClipForge runtime did not become healthy in time." >&2
          exit 1
