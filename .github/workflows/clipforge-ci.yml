name: ClipForge CI

concurrency:
  group: clipforge-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/clipforge-core-rescue' }}

on:
  push:
    branches: [main, "chatgpt/**", "work/**", "codex/clipforge-core-rescue"]
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "services/clip/**"
      - "services/news/**"
      - "types/clip.ts"
      - "types/news.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "eslint.config.mjs"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "services/**"
      - "lib/**"
      - "types/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - "clipforge/vercel.json"
      - ".github/workflows/clipforge-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install media tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg espeak-ng tesseract-ocr tesseract-ocr-spa

      - name: Verify code
        run: npm run verify

      - name: Build
        run: npx next build

      - name: Resumable upload service and real MP4
        run: node scripts/core-rescue-e2e.mjs

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-core-rescue-media
          path: artifacts/core-rescue/first-validated.mp4

      - name: Phase 1 end-to-end
        run: npm run phase1:e2e

      - name: Six-scene narrated story acceptance
        run: node scripts/story-scenes-e2e.mjs

      - name: Complete video silence editing acceptance
        run: node scripts/video-autoedit-e2e.mjs

      - name: Install isolated browser test tooling
        run: |
          npm install --prefix /tmp/clipforge-browser --no-save --no-package-lock playwright@1.56.1
          node /tmp/clipforge-browser/node_modules/playwright/cli.js install --with-deps chrome

      - name: Android-equivalent browser, real APIs and downloads
        run: node scripts/mobile-browser-e2e.mjs

      - name: Story and edited video evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-story-and-edit-media
          path: |
            artifacts/story-scenes/maya-60s.mp4
            artifacts/story-scenes/evidence.json
            artifacts/story-scenes/scene-*.jpg
            artifacts/video-autoedit/*.mp4
            artifacts/video-autoedit/evidence.json
            artifacts/mobile-browser/*

      - name: Clip render end-to-end
        run: npm run render:e2e

      - name: AutoEdit full end-to-end
        run: npm run autoedit:e2e

      - name: Owned Content end-to-end
        run: npm run owned-content:e2e

      - name: Auto Focus end-to-end
        run: npm run reframe:e2e

      - name: News Mode end-to-end
        run: npm run news:e2e
      - name: Read-only deployed runtime health
        run: node scripts/deployed-runtime-check.mjs
      - name: Preserve deployed status
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-deployed-status
          path: artifacts/deployed-runtime/evidence.json

  real-whisper-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install free local media tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg espeak-ng tesseract-ocr tesseract-ocr-spa
      - name: Build existing pinned Whisper implementation
        run: bash scripts/setup-whisper-ci.sh
      - name: Twenty-minute recording and three real clips
        run: node scripts/best-clips-e2e.mjs
      - name: Full editing with real Whisper subtitles
        run: node scripts/video-autoedit-e2e.mjs --with-whisper
      - name: Build app for clip browser acceptance
        run: npx next build
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/clipforge-browser --no-save --no-package-lock playwright@1.56.1
          node /tmp/clipforge-browser/node_modules/playwright/cli.js install --with-deps chrome
      - name: Upload long recording, generate and download three clips from mobile browser
        run: node scripts/mobile-browser-e2e.mjs --clips-only
      - name: Preserve clips and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-three-clips-media
          path: |
            artifacts/best-clips/clip-*.mp4
            artifacts/best-clips/clip-*.jpg
            artifacts/best-clips/podcast-20m.mp4
            artifacts/best-clips/evidence.json
            artifacts/best-clips/transcript-and-cues.json
            artifacts/best-clips/authored-narration.txt
            artifacts/video-autoedit/*.mp4
            artifacts/video-autoedit/evidence.json
            artifacts/mobile-browser/*


  prepare-rescue-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/clipforge-core-rescue'
    needs: [verify, real-whisper-clips]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare requested draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_EXISTING_PR=$(gh pr list --base main --head codex/clipforge-core-rescue --state open --json number --jq '.[0].number')
          if [ -n "$TASK_EXISTING_PR" ]; then
            gh pr view "$TASK_EXISTING_PR" --json url --jq .url
          else
            gh pr create --draft --base main --head codex/clipforge-core-rescue --title "Repair resumable uploads and three real MP4 production tools" --body-file docs/CORE_RESCUE_PR.md
          fi
